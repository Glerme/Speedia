name: Release

# Enviar uma tag de versão (ex.: v1.0.0) cria uma release com o zip da extensão,
# as novidades do CHANGELOG.md e o updates.json do Firefox.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir versão do manifest
        run: |
          version=$(jq -r .version static/manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::A tag $TAG não bate com a versão $version do static/manifest.json"
            exit 1
          fi

      # As novidades da versão saem do CHANGELOG.md; sem a seção, a release não é publicada.
      - name: Extrair as novidades do changelog
        run: |
          version=$(jq -r .version static/manifest.json)
          awk -v v="$version" '$1 == "##" && $2 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::Falta a seção '## $version' no CHANGELOG.md"
            exit 1
          fi
          cat changes.md

      - name: Montar o zip
        run: |
          scripts/build.sh full package
          scripts/build.sh store package
          cd package && zip -r "speedia-$TAG.zip" speedia
          # O Firefox espera o manifest na raiz do arquivo.
          (cd speedia && zip -r "../speedia-firefox-$TAG.zip" .)
          # Edições das lojas (sem download de vídeos).
          (cd speedia-store && zip -r "../speedia-store-chrome-$TAG.zip" .)
          (cd speedia-store-firefox && zip -r "../speedia-store-firefox-$TAG.zip" .)

      # Só roda se os secrets da Mozilla existirem; gera um .xpi de instalação permanente.
      - name: Assinar para o Firefox
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice::Secrets AMO_JWT_ISSUER/AMO_JWT_SECRET ausentes; release sem .xpi assinado"
            exit 0
          fi
          npx --yes web-ext sign --channel=unlisted --source-dir package/speedia --artifacts-dir package/signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv package/signed/*.xpi "package/speedia-firefox-$TAG.xpi"

      # O Firefox consulta este arquivo (update_url do manifest) para atualizar o .xpi instalado.
      - name: Gerar o arquivo de atualização do Firefox
        run: |
          xpi="package/speedia-firefox-$TAG.xpi"
          if [ ! -f "$xpi" ]; then
            echo "::notice::Sem .xpi assinado; release sem updates.json"
            exit 0
          fi
          jq -n \
            --arg id "$(jq -r .browser_specific_settings.gecko.id static/manifest.json)" \
            --arg version "$(jq -r .version static/manifest.json)" \
            --arg link "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/speedia-firefox-$TAG.xpi" \
            --arg hash "sha256:$(sha256sum "$xpi" | cut -d' ' -f1)" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash}]}}}' \
            > package/updates.json
          cat package/updates.json

      - name: Criar a release
        run: |
          shopt -s nullglob
          { echo "## Novidades"; cat changes.md; echo; } > notes.md
          cat >> notes.md <<'EOF'
          ## Como instalar no Chrome

          1. Baixe `speedia-$TAG.zip` abaixo e descompacte.
          2. Abra `chrome://extensions` e ative o **Modo do desenvolvedor**.
          3. Clique em **Carregar sem compactação** e escolha a pasta `speedia`.
          4. Recarregue as abas do Instagram e do X que já estiverem abertas.

          ## Como instalar no Firefox

          Se houver um `speedia-firefox-$TAG.xpi` abaixo, abra-o no Firefox e confirme a instalação.
          Instalado assim, o Firefox passa a atualizar a extensão sozinho a cada nova release.

          Sem o `.xpi`, a instalação é temporária (some ao fechar o Firefox):

          1. Baixe `speedia-firefox-$TAG.zip` abaixo (não precisa descompactar).
          2. Abra `about:debugging#/runtime/this-firefox`.
          3. Clique em **Carregar extensão temporária** e escolha o zip.
          EOF
          sed -i "s/\$TAG/$TAG/g" notes.md
          gh release create "$TAG" package/speedia-*.zip package/speedia-*.xpi package/updates.json --title "Speedia $TAG" --notes-file notes.md --generate-notes
