<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Demo feed</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0f14; color: #e8eaf0; font: 15px/1.4 system-ui, sans-serif; }
  header { position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 5; display: flex; align-items: center; gap: 12px;
    padding: 0 20px; background: rgba(13,15,20,.92); border-bottom: 1px solid #222736; font-weight: 700; }
  header i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#6aa8ff,#9b6bff); }
  main { width: 560px; margin: 0 auto; padding: 68px 0 400px; }
  article { background: #151922; border: 1px solid #222736; border-radius: 14px; margin-bottom: 18px; overflow: hidden; }
  .who { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg,#ffb36b,#ff6b9b); }
  .who b { display: block; font-size: 14px; } .who span { color: #8a91a6; font-size: 12px; }
  video, .img { display: block; width: 100%; aspect-ratio: 16/9; background: #000; }
  .img { background: linear-gradient(135deg,#1e3c72,#2a9d8f 60%,#e9c46a); }
  .txt { padding: 12px 14px 16px; color: #aab0c2; }
  .line { height: 9px; border-radius: 5px; background: #262c3d; margin-top: 9px; }
</style></head><body>
<header><i></i>Demo feed</header>
<main>
  <article><div class="who"><div class="av"></div><div><b>Ana Demo</b><span>2h</span></div></div>
    <video id="v" src="/cache/demo.mp4" loop playsinline></video>
    <div class="txt">Sunrise over the fractal sea.<div class="line" style="width:80%"></div><div class="line" style="width:55%"></div></div></article>
  <article><div class="who"><div class="av" style="background:linear-gradient(135deg,#6bffb3,#2a9d8f)"></div><div><b>Leo Sample</b><span>5h</span></div></div>
    <div class="img"></div><div class="txt">Another post below the fold.<div class="line" style="width:70%"></div></div></article>
  <article><div class="who"><div class="av"></div><div><b>Mia Mock</b><span>1d</span></div></div>
    <div class="img" style="background:linear-gradient(135deg,#6a11cb,#2575fc)"></div><div class="txt"><div class="line" style="width:90%"></div></div></article>
</main>
<script src="/demo/stub.js"></script>
<script src="/ext/edition.js"></script>
<script src="/ext/content.js"></script>
</body></html>
