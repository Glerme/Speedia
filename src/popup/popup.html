<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extName">Speedia</title>
    <style>
      /* Tokens: destaque extraído do ícone (violeta #bf22ed), ajustado para contraste AA em cada tema. */
      :root {
        color-scheme: light;
        --bg: #f4f2f8;
        --card: #ffffff;
        --border: #e2dfe9;
        --text: #1b1724;
        --muted: #5f5a6e; /* 6.3:1 sobre --card */
        --accent: #bf22ed; /* sobrescrito pelo popup.js (storage 'accent') */
        --accent-text: #ffffff;
        --accent-ui: #9c1cc4;
        --accent-ui-text: #ffffff;
        --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--card));
        --control: #eeebf4;
        --control-hover: #e3dfec;
        --track-off: #6f6a80; /* 5:1 sobre --card (contraste de componente) */
        --warn-bg: #fff4d6;
        --warn-text: #5c4300;
        --focus: #7a12a0; /* ajustado pelo popup.js conforme o destaque */
        --shadow: 0 1px 2px rgba(27, 23, 36, 0.06);
      }
      /* data-theme é sempre definido pelo popup.js (resolve 'auto' via prefers-color-scheme). */
      :root[data-theme='dark'] {
        --bg: #121017;
        --card: #1c1925;
        --border: #302c3d;
        --text: #f2eff8;
        --muted: #aaa4bc; /* 7:1 sobre --card */
        --control: #2a2636;
        --control-hover: #373248;
        --track-off: #8d869f;
        --warn-bg: #3a2f10;
        --warn-text: #ffe7a3;
        --focus: #e29bf7;
        --shadow: none;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      body { margin: 0; width: 340px; padding: 14px; background: var(--bg); color: var(--text);
        font: 500 13px/1.4 system-ui, sans-serif; }

      header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      header img { width: 36px; height: 36px; border-radius: 9px; display: block; }
      h1 { margin: 0; font-size: 16px; line-height: 1.2; }
      .version { font-size: 12px; font-weight: 400; color: var(--muted); }

      section { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
        box-shadow: var(--shadow); padding: 4px 12px 6px; margin-bottom: 10px; }
      h2 { margin: 10px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
        color: var(--muted); }

      .item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--border); }
      h2 + .item, #shortcuts .item:first-child { border-top: 0; }
      #shortcuts { margin-top: 0; }
      .text { flex: 1; min-width: 0; }
      .hint { font-size: 12px; font-weight: 400; color: var(--muted); }
      .item.flash { animation: flash 1.4s ease-out; }
      @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }

      button { font: inherit; color: inherit; cursor: pointer; border: 1px solid transparent; border-radius: 8px;
        background: var(--control); padding: 6px 10px; }
      button:hover { background: var(--control-hover); }
      button:focus-visible, .switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
      .key { min-width: 92px; font-weight: 600; text-align: center; }
      .key.empty { font-weight: 400; color: var(--muted); }
      .key.rec { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
      .clear { padding: 6px 9px; color: var(--muted); }
      .clear:hover { color: var(--text); }

      /* Toggle switch acessível: checkbox nativo com role=switch por baixo do visual. */
      label.item { cursor: pointer; }
      .switch { position: relative; flex: none; width: 40px; height: 24px; }
      .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
      .track { position: absolute; inset: 0; border-radius: 12px; background: var(--track-off); transition: background .15s; pointer-events: none; }
      .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
        background: #fff; transition: transform .15s; }
      .switch input:checked + .track { background: var(--accent-ui); }
      .switch input:checked + .track::after { transform: translateX(16px); background: var(--accent-ui-text); }
      @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } .item.flash { animation: none; } }

      /* Aparência */
      .seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--control); margin: 8px 0; }
      .seg label { flex: 1; position: relative; }
      .seg input, .sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
      .seg span { display: block; padding: 6px 4px; border-radius: 8px; text-align: center; pointer-events: none; }
      .seg input:checked + span { background: var(--accent-ui); color: var(--accent-ui-text); font-weight: 600; }
      .seg input:focus-visible + span, .sw input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
      .sub { margin: 8px 0 0; font-size: 12px; font-weight: 600; color: var(--muted); }
      .seg { margin-top: 4px; }
      .accent { display: flex; align-items: center; gap: 12px; padding: 6px 0 4px; }
      .swatches { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; justify-items: center; }
      .sw { position: relative; width: 28px; height: 28px; }
      .sw span { display: block; width: 100%; height: 100%; border-radius: 50%; pointer-events: none;
        box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .45); }
      .sw span { display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
      .sw input:checked + span { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--text); }
      .sw input:checked + span::after { content: '✓'; }
      .ring { position: relative; width: 112px; height: 112px; flex: none; }
      #ring { width: 100%; height: 100%; border-radius: 50%; cursor: pointer; touch-action: none; display: block; }
      #ring:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      #ringDot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none;
        background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .55); }
      #ringCenter { position: absolute; inset: 0; margin: auto; width: 62px; height: 62px; border-radius: 50%; pointer-events: none;
        background: var(--accent); color: var(--accent-text); display: flex; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .45); }
      #accentReset { display: block; margin: 4px 0 6px auto; }

      footer { display: flex; flex-direction: column; gap: 8px; }
      #reset { align-self: flex-end; }
      #bar { display: flex; align-items: center; gap: 8px; border-radius: 8px; font-size: 12px; font-weight: 500; }
      #bar.on { padding: 7px 10px; background: var(--warn-bg); color: var(--warn-text); }
      #statusText { flex: 1; }
      #undo { padding: 3px 8px; background: transparent; border-color: currentColor; color: inherit; font-weight: 600; }
      #undo[hidden] { display: none; }
      button:disabled { opacity: .4; cursor: default; }
      button:disabled:hover { background: var(--control); }
    </style>
    <script src="popup-theme.js"></script>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <div>
        <h1>Speedia</h1>
        <div class="version" id="version"></div>
      </div>
    </header>

    <section aria-labelledby="h-shortcuts">
      <h2 id="h-shortcuts" data-i18n="popupShortcutsHeading"></h2>
      <div id="shortcuts"></div>
    </section>

    <section aria-labelledby="h-pip">
      <h2 id="h-pip" data-i18n="popupMiniPlayerHeading"></h2>
      <label class="item">
        <span class="text">
          <span data-i18n="popupAutoPipLabel"></span>
          <span class="hint" style="display: block" data-i18n="popupAutoPipHint"></span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" id="autoPip" />
          <span class="track"></span>
        </span>
      </label>
      <label class="item">
        <span class="text">
          <span data-i18n="popupTabPipLabel"></span>
          <span class="hint" style="display: block" data-i18n="popupTabPipHint"></span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" id="tabPip" />
          <span class="track"></span>
        </span>
      </label>
      <div class="item" id="allowSiteItem">
        <button id="allowSite" type="button" data-i18n="popupAllowSite"></button>
      </div>
    </section>

    <section aria-labelledby="h-look">
      <h2 id="h-look" data-i18n="popupAppearanceHeading"></h2>
      <div class="sub" id="l-theme" data-i18n="popupThemeLabel"></div>
      <div class="seg" role="radiogroup" aria-labelledby="l-theme">
        <label><input type="radio" name="theme" value="auto" /><span data-i18n="popupThemeAuto"></span></label>
        <label><input type="radio" name="theme" value="light" /><span data-i18n="popupThemeLight"></span></label>
        <label><input type="radio" name="theme" value="dark" /><span data-i18n="popupThemeDark"></span></label>
      </div>
      <div class="sub" id="l-accent" data-i18n="popupAccentLabel"></div>
      <div class="accent">
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="l-accent"></div>
        <div class="ring">
          <canvas id="ring" width="112" height="112" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="359"
            data-i18n-aria-label="popupAccentRingLabel"></canvas>
          <span id="ringCenter" aria-hidden="true"></span>
          <span id="ringDot"></span>
        </div>
      </div>
      <button id="accentReset" type="button" data-i18n="popupAccentReset"></button>
    </section>

    <footer>
      <div id="bar">
        <span id="statusText" role="status" aria-live="polite"></span>
        <button id="undo" type="button" hidden data-i18n="popupUndo"></button>
      </div>
      <button id="reset" type="button" data-i18n="popupReset"></button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
